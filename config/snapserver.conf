# Stub snapserver.conf — jukeplox embedded Snapcast backend (2026-08-11 plan U3/U4).
#
# snapserver silently ignores its --stream.* / --http.* / --tcp.* CLI arguments
# when it has no config file to anchor them, so the embedded supervisor
# (app/output/snapcast_server.py) ALWAYS launches it with
# `--config=/app/config/snapserver.conf` pointing here. This file intentionally
# carries only empty section headers: every real setting (the tcp:// source, the
# codec/buffer/chunk sizes, the control + HTTP ports, and their loopback bind
# hosts) is supplied on the CLI by the supervisor so a single code path owns the
# runtime configuration and nothing here can drift out of sync with it.
#
# Do NOT add stream/source definitions here — the supervisor's CLI is the source
# of truth. Editing this file is not a supported configuration surface.

