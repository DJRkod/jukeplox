services:
  jukeplex:
    build: .
    network_mode: host        # REQUIRED: mDNS (Chromecast/AirPlay) + SSDP (DLNA)
    volumes:
      - ./data:/data
      # Lets Jukeplox use the host's avahi over D-Bus when a host mDNS daemon
      # already owns UDP 5353 (e.g. TrueNAS) — the automatic fallback for
      # discovery. Harmless on hosts without avahi. One-time; survives reboots.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    # Attached-speaker audio. /dev/snd is the HEADLESS path (no host sound server).
    # On a Linux DESKTOP (PulseAudio/PipeWire owns the card) remove this and use the
    # pulse route instead — see INSTALL.md Step 4. Omit entirely if you only cast to
    # LAN speakers (Chromecast/AirPlay/DLNA).
    devices:
      - /dev/snd             # headless ALSA passthrough (Linux only); desktop → use PULSE_SERVER
    # group_add:             # uncomment with /dev/snd so the container may open the card
    #   - audio
    environment:
      BIND_HOST: "0.0.0.0"   # set to your LAN IP (e.g. 192.168.1.50) so Cast/DLNA can reach the stream proxy
      # PORT: "70"           # HTTP listen port (default 80). Under host networking this is the host port
                             # directly — set a free one if 80 is taken (e.g. the TrueNAS web UI uses 80).
      # Desktop audio instead of /dev/snd (replace 1000 with `id -u`); also add the
      # matching socket volume below:
      # PULSE_SERVER: "unix:/run/user/1000/pulse/native"
      # and under volumes:  - /run/user/1000/pulse/native:/run/user/1000/pulse/native
    restart: unless-stopped
