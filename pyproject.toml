[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jukeplox"
version = "0.1.0"
description = "Party jukebox powered by Plex"
requires-python = ">=3.12"
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    "pychromecast>=14.0",
    "zeroconf>=0.130",
    "async-upnp-client>=0.40",
    "mutagen>=1.47",
    "cryptography>=43",
    # Server-fed multi-room backends (2026-08-11 plan U3). Baked into the ONE
    # image; both backends are DORMANT by default (imported only inside their
    # enable path — R16), so a disabled backend pays no import/runtime cost.
    # EXACT pins, deliberately: aiosendspin had ~9 breaking majors in ~8 months
    # (isolated behind app/output/sendspin_adapter.py), and snapcast's control
    # surface is version-sensitive. The `[server]` extra drags in PyAV/numpy/
    # pillow (attributed in THIRD_PARTY_LICENSES). Exact versions are the
    # settle-at-image-build values (plan "Deferred to Implementation").
    "snapcast==2.3.8",
    "aiosendspin[server]==9.1.0",
    # Used DIRECTLY by sendspin_adapter to decode album art before handing it to
    # the artwork role. It arrives transitively via aiosendspin[server] today,
    # but relying on that would break the moment that extra is repackaged.
    "pillow>=10",
    # snapcast 2.3.8 imports `packaging` but does NOT declare it as a dependency
    # (undeclared transitive) — the embedded snapserver control connect fails at
    # runtime with "No module named 'packaging'" without it. Caught on the arm64
    # rig 2026-08-12 (the in-image e2e masked it because pytest pulls packaging).
    "packaging>=23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    # 2026-08-11 plan U10: the snapclient-subprocess e2e is the R18 hardware-free
    # gate. It skips where the binary is absent (Windows dev) and MUST pass inside
    # the built image — a bare skip does not satisfy R18.
    "requires_snapclient: needs the snapserver+snapclient binaries (in-image gate)",
]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
