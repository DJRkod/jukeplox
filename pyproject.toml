[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jukeplox"
version = "0.1.0"
description = "Party jukebox powered by Plex"
requires-python = ">=3.12"
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    "pychromecast>=14.0",
    "zeroconf>=0.130",
    "async-upnp-client>=0.40",
    "mutagen>=1.47",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
